<style>
/* Layout: NITTIONE monochrome — thin letter-spaced wordmark on white, one narrow column of hairline cards, black as the only accent */
:root{
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f5f5f4;--ink:#0b0b0b;--muted:#6f6f6f;--line:#e1e1df;--line-strong:#0b0b0b;
  --accent:#0b0b0b;--accent-soft:#efefee;--on-accent:#ffffff;--alert:#c4271c;
  --head:#ffffff;--head-ink:#000000;--head-muted:#6f6f6f;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:6px;--rb:4px;color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--line)}
header .wrap{padding-block:30px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand{margin:0;font-size:clamp(24px,7.5vw,34px);font-weight:500;letter-spacing:.5em;padding-left:.5em;line-height:1}
.sub-brand{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--head-muted)}
#status{font-size:12px;color:var(--head-muted);display:flex;align-items:center;gap:6px}
#status i{width:7px;height:7px;border-radius:50%;border:1px solid var(--head-muted);display:inline-block}
#status.ok i{background:var(--head-ink);border-color:var(--head-ink)}
#status.err i{background:var(--alert);border-color:var(--alert)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:none;justify-content:safe center}
nav button{background:transparent;color:var(--muted);border:1px solid transparent;white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;min-height:38px}
nav button.on{color:var(--ink);border-color:var(--ink)}
main.wrap{padding-block:18px 96px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h3{margin:0;font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--rb);padding:11px 12px;font:inherit;min-height:46px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line-strong)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:13px;letter-spacing:.04em;border-radius:var(--rb);padding:11px 14px;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:42px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
button.danger{color:var(--ink);background:transparent;border-color:var(--line-strong)}
button.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{min-height:34px;padding:6px 12px;border-radius:100px;font-size:12px;white-space:nowrap;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.ghost.chip{text-decoration:underline}
.plist{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border-top:1px solid var(--line)}
.prow{display:flex;justify-content:space-between;gap:10px;text-align:left;font-weight:500;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 4px;letter-spacing:0;font-size:14px}
.prow .pr{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.on{font-weight:700}.prow.on .pr{color:var(--ink)}
.item{border:1px solid var(--line);border-radius:var(--rb);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.x{min-height:34px;padding:4px 10px;background:transparent;color:var(--muted);border-color:transparent}
.quick{display:flex;gap:6px}
.sub{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line-strong);padding:14px 2px 2px}
.total strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{margin:0;padding:18px 8px;text-align:center;color:var(--muted)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:100px;padding:4px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.debt{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.paid{color:var(--ink);border-color:var(--ink)}
.pill.over{color:var(--ink);border:1px dashed var(--ink)}
.notice{border:1px solid var(--line-strong);border-radius:var(--rb);padding:12px;font-size:13px}
.notice.info{border-color:var(--line);background:var(--surface)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;border-bottom-color:var(--line-strong)}
tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rb);overflow:hidden}
.stat{background:var(--surface);padding:12px;min-width:0}
.stat b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}.stat:last-child:nth-child(odd){grid-column:1/-1}}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface);padding:14px;letter-spacing:0;font-weight:500}
.rcard .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.rcard .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--rb);font-weight:500;font-size:14px;max-width:calc(100% - 32px)}
#toast.err{background:var(--alert);color:#fff}
.dlg{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.dlg-box{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
.dlg-box p{margin:0;white-space:pre-line}
.dlg-box textarea{min-height:200px;font-size:13px}
.dlg-box .actions{justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s,color .15s}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
#status.warn i{background:transparent;border-color:var(--head-ink)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* --- compact, readable layout --- */
body{font-size:15px}
header .wrap{padding-block:14px 12px;gap:6px}
.brand{font-size:clamp(18px,5.6vw,24px);font-weight:500;letter-spacing:.46em;padding-left:.46em}
.sub-brand{display:none}
#status{font-size:12px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-block:0;overflow:visible;justify-content:stretch}
nav button{border:0;border-top:2px solid transparent;border-radius:0;min-height:56px;padding:6px 2px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);border-top-color:var(--ink);border-left:0;border-right:0;border-bottom:0}
main.wrap{padding-block:14px calc(90px + env(safe-area-inset-bottom,0px));gap:10px}
button{font-size:14px;letter-spacing:0;min-height:40px;padding:9px 12px}
button.primary{font-size:13px;letter-spacing:.08em}
.card{padding:14px;gap:10px}
.meta b{color:var(--ink)}
.ship{padding:0;gap:0;overflow:hidden}
.ship-head{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:0;padding:14px;min-height:0;font-weight:400}
.sh-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.sh-t{font-size:16px;font-weight:600;line-height:1.25}
.sh-t i{font-style:normal;color:var(--muted);font-weight:500;margin-right:6px}
.sh-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sh-sum{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--muted);font-size:18px;transition:transform .15s}
.ship.open .chev{transform:rotate(90deg)}
.ship-body{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts button{padding:9px 4px;font-size:13px}
.acts2{display:flex;justify-content:space-between;gap:8px}
.acts2 .ghost{padding-inline:0}
.linkdanger{color:var(--alert)!important}
</style>

let qt;function queueSync(){clearTimeout(qt);qt=setTimeout(()=>sync(),700)}
async function sync(manual){
  if(!cfg.url){drawStatus();return}

  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);

}

  if(!cfg.url){c='warn';t='Данные только на этом телефоне'}
  else if(syncing){t='Синхронизация…'}
  else if(syncErr){c='err';t='Не отправлено: '+syncErr+'. Всё сохранено на телефоне'}
  else if(meta.dirty){c='warn';t='Ждёт отправки в таблицу'}
  else{c='ok';t='Сохранено в таблице'+(time?' · '+time:'')}
  el.className=c;el.querySelector('span').textContent=t;
}
function render(){
  if(!TABS.some(t=>t[0]===tab))tab='new';
  $('tabs').innerHTML=TABS.map(([id,n])=>`<button class="${tab===id?'on':''}" onclick="nav('${id}')">${ICON[id]}<span>${n}</span></button>`).join('');

  if(empty&&tab!=='data'){
    if(cfg.url&&(syncing||firstPull)){$('view').innerHTML='<section class="card"><p class="empty">Загружаю данные из таблицы…</p></section>';return}

}
function renderWelcome(){

    <button class="rcard" onclick="$('f-imp0').click()"><span class="l"><b>Восстановить из резервной копии</b><span class="meta">Файл .json из старого или облачного приложения</span></span><span class="meta">›</span></button>

function loadInitial(){const d=window.INITIAL;COLS.forEach(c=>(d[c]||[]).forEach(x=>put(c,structuredClone(x),true)));commit();toast('Перенесено: '+d.shipments.length+' накладных');render()}

/* ---------- new invoice ---------- */
function recOptions(sel){const names=recNames();if(sel&&!names.includes(sel))names.unshift(sel);if(!names.length)return'<option value="">Сначала добавь получателя во вкладке «Данные»</option>';return names.map(n=>`<option value="${esc(n)}" ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}
function itemRow(x,i){return`<div class="item"><div class="row"><b>${esc(label(x))}</b><button class="x" aria-label="Убрать позицию" onclick="removeItem(${i})">✕</button></div><div class="grid2"><label class="fld"><span>Количество, шт.</span><input id="q${i}" type="number" inputmode="decimal" min="0" step="any" value="${esc(x.qty)}" oninput="setItem(${i},'qty',this.value)"></label><label class="fld"><span>Цена, ₽</span><input id="p${i}" type="number" inputmode="decimal" min="0" step="any" value="${esc(x.price)}" oninput="setItem(${i},'price',this.value)"></label></div><div class="row"><div class="quick">${[10,50,100].map(n=>`<button class="chip" onclick="bump(${i},${n})">+${n}</button>`).join('')}</div><span class="sub" id="st${i}">${money(x.qty*x.price)}</span></div></div>`}
function renderNew(){
  if(!draft.recipient)draft.recipient=lastRecipient();
  const q=draft.items,no=editing?editing.number:nextNo();
  $('view').innerHTML=`
  ${cfg.url?'':'<div class="notice">Сейчас данные хранятся только в этом телефоне. Подключи Google Таблицу во вкладке «Данные», чтобы ничего не потерять.</div>'}
  <section class="card">
    <div class="row"><h2>${editing?'Изменение № '+esc(no):'Накладная № '+esc(no)}</h2>${editing?'<button class="ghost" onclick="cancelEdit()">Отмена</button>':''}</div>
    <div class="grid2">
      <label class="fld"><span>Получатель</span><select id="f-rec" onchange="draft.recipient=this.value">${recOptions(draft.recipient)}</select></label>
      <label class="fld"><span>Дата</span><input id="f-date" type="date" value="${esc(draft.date)}" onchange="draft.date=this.value"></label>
    </div>
  </section>
  <section class="card">
    <div class="row"><h2>Добавить модель</h2><button class="ghost chip" onclick="nav('catalog')">+ Новая модель</button></div>
    <input id="f-pq" type="search" placeholder="Поиск: бини, флис, джек…" value="${esc(pq)}" oninput="pq=this.value;drawPList()">
    <div id="plist" class="plist"></div>
  </section>
  <section class="card">
    <div class="row"><h2>В накладной</h2><span class="muted">${q.length} поз.</span></div>
    ${q.length?q.map(itemRow).join(''):'<p class="empty">Нажми на модель выше, чтобы добавить её</p>'}
    <div class="total"><span class="muted">Всего <b id="t-count">${num(count(q))}</b> шт.</span><strong id="t-sum">${money(sum(q))}</strong></div>
    <div class="actions">
      <button class="primary" onclick="saveInvoice()">${editing?'Сохранить изменения':'Сохранить накладную'}</button>
      <button onclick="exportPNG(draftDoc())">Фото</button><button onclick="exportPDF(draftDoc())">PDF</button><button onclick="copyText(draftDoc())">Текст</button>
      ${q.length?'<button class="ghost" onclick="resetDraft()">Очистить</button>':''}
    </div>
  </section>`;
  drawPList();
}
function drawPList(){const el=$('plist');if(!el)return;const t=pq.trim().toLowerCase(),inD=new Set(draft.items.map(x=>x.productId));const ps=S.products.slice().sort(byName).filter(p=>!t||(p.name+' '+p.variant).toLowerCase().includes(t));el.innerHTML=ps.length?ps.map(p=>`<button class="prow ${inD.has(p.id)?'on':''}" onclick="addItem('${esc(p.id)}')"><span>${esc(label(p))}</span><span class="pr">${inD.has(p.id)?'✓ ':''}${money(p.price)}</span></button>`).join(''):`<p class="empty">${S.products.length?'Ничего не нашлось':'Каталог пуст. Добавь модели во вкладке «Каталог»'}</p>`}
function addItem(id){const p=S.products.find(x=>x.id===id);if(!p)return;const i=draft.items.findIndex(x=>x.productId===id);if(i>=0){toast('Уже в накладной, поменяй количество');const el=$('q'+i);el?.focus();el?.scrollIntoView({block:'center'});return}draft.items.push({productId:p.id,name:p.name,variant:p.variant||'Стандарт',qty:100,price:+p.price||0});renderNew();toast('Добавлено: '+label(p))}
function removeItem(i){draft.items.splice(i,1);renderNew()}
function updTotals(i){const x=draft.items[i];if(x&&$('st'+i))$('st'+i).textContent=money((+x.qty||0)*(+x.price||0));$('t-count').textContent=num(count(draft.items));$('t-sum').textContent=money(sum(draft.items))}
function setItem(i,k,v){draft.items[i][k]=v;updTotals(i)}
function bump(i,n){const x=draft.items[i];x.qty=(+x.qty||0)+n;$('q'+i).value=x.qty;updTotals(i)}
async function resetDraft(){if(draft.items.length&&!await ask('Очистить текущую накладную?','Очистить',{danger:1}))return;editing=null;draft={recipient:draft.recipient,date:today(),items:[]};renderNew()}
function cancelEdit(){editing=null;draft={recipient:lastRecipient(),date:today(),items:[]};renderNew()}
function draftDoc(){if(!draft.items.length){toast('Сначала добавь позиции','err');return null}return{number:editing?.number||'черновик',recipient:draft.recipient,date:draft.date,items:draft.items.map(x=>({...x,qty:+x.qty||0,price:+x.price||0}))}}
function saveInvoice(){
  if(!draft.recipient)return toast('Выбери получателя','err');
  if(!draft.items.length)return toast('Добавь хотя бы одну модель','err');
  if(draft.items.some(x=>!(+x.qty>0)||!(+x.price>=0)))return toast('Проверь количество и цены','err');
  const no=editing?editing.number:nextNo();
  const rec={id:editing?.id||uid('s'),number:no,date:draft.date||today(),recipient:draft.recipient,items:draft.items.map(x=>({productId:x.productId||'',name:x.name,variant:x.variant||'Стандарт',qty:+x.qty,price:+x.price})),createdAt:editing?.createdAt||nowIso()};
  put('shipments',rec);
  toast('Накладная № '+no+' сохранена');editing=null;draft={recipient:rec.recipient,date:today(),items:[]};openShip=rec.id;hq='';hr='';nav('history');
}

/* ---------- history ---------- */
function renderHistory(){
  $('view').innerHTML=`<section class="card"><input id="f-hq" type="search" placeholder="Поиск по номеру, модели, дате…" value="${esc(hq)}" oninput="hq=this.value;drawHList()"><div class="chips">${['',...recNames()].map(r=>`<button class="chip ${hr===r?'on':''}" data-r="${esc(r)}" onclick="hr=this.dataset.r;renderHistory()">${r?esc(r):'Все'}</button>`).join('')}</div><div id="h-sum" class="meta"></div></section><div id="hlist" class="list"></div>`;

}
function drawHList(){
  const t=hq.trim().toLowerCase(),cw=(typeof canWrite==='undefined')||canWrite;
  const ss=S.shipments.filter(s=>(!hr||s.recipient===hr)&&(!t||(s.number+' '+s.recipient+' '+fmtD(s.date)+' '+(s.items||[]).map(label).join(' ')).toLowerCase().includes(t))).sort(byDateDesc);
  $('h-sum').textContent=`Найдено ${ss.length} · ${num(ss.reduce((a,s)=>a+count(s.items),0))} шт. · ${money(ss.reduce((a,s)=>a+sum(s.items),0))}`;
  $('hlist').innerHTML=ss.length?ss.map(s=>{const open=openShip===s.id,id=esc(s.id);return`<section class="card ship ${open?'open':''}">
    <button class="ship-head" aria-expanded="${open}" onclick="toggleShip('${id}')"><span class="sh-l"><span class="sh-t"><i>№${esc(s.number)}</i>${esc(s.recipient)}</span><span class="meta">${fmtD(s.date)} · ${num(count(s.items))} шт. · ${(s.items||[]).length} поз.</span></span><span class="sh-r"><span class="sh-sum">${money(sum(s.items))}</span><span class="chev">›</span></span></button>
    ${open?`<div class="ship-body"><div class="tbl"><table><thead><tr><th>Модель</th><th>Шт.</th><th>Цена</th><th>Сумма</th></tr></thead><tbody>${(s.items||[]).map(x=>`<tr><td>${esc(label(x))}</td><td>${num(x.qty)}</td><td>${num(x.price)}</td><td>${num(x.qty*x.price)}</td></tr>`).join('')}</tbody></table></div>
    <div class="acts"><button onclick="exportPNG(shipById('${id}'))">Фото</button><button onclick="exportPDF(shipById('${id}'))">PDF</button><button onclick="copyText(shipById('${id}'))">Текст</button><button onclick="repeatInvoice('${id}')">Повтор</button></div>
    ${cw?`<div class="acts2"><button class="ghost" onclick="editInvoice('${id}')">Изменить</button><button class="ghost linkdanger" onclick="deleteInvoice('${id}')">Удалить</button></div>`:''}</div>`:''}
  </section>`}).join(''):`<section class="card"><p class="empty">${S.shipments.length?'Ничего не нашлось':'Отправок пока нет. Создай первую накладную'}</p></section>`;
}
const shipById=id=>S.shipments.find(x=>x.id===id);
function toggleShip(id){openShip=openShip===id?null:id;drawHList()}
function editInvoice(id){const s=shipById(id);if(!s)return;editing=s;draft={recipient:s.recipient,date:s.date,items:structuredClone(s.items||[])};nav('new')}
function repeatInvoice(id){const s=shipById(id);if(!s)return;editing=null;draft={recipient:s.recipient,date:today(),items:structuredClone(s.items||[])};nav('new');toast('Скопировано из № '+s.number+'. Проверь количество')}
async function deleteInvoice(id){const s=shipById(id);if(!s||!await ask(`Удалить накладную № ${s.number} (${s.recipient})? Это нельзя отменить.`,'Удалить',{danger:1}))return;remove('shipments',id);toast('Накладная удалена');render()}

/* ---------- summary ---------- */
function recStats(name){const sh=S.shipments.filter(s=>s.recipient===name),pay=S.payments.filter(p=>p.recipient===name);const shipped=sh.reduce((a,s)=>a+sum(s.items),0),paid=pay.reduce((a,p)=>a+(+p.amount||0),0);return{sh,pay,shipped,paid,debt:shipped-paid}}
function debtPill(d){return d>0.005?`<span class="pill debt">долг ${money(d)}</span>`:d<-0.005?`<span class="pill over">переплата ${money(-d)}</span>`:`<span class="pill paid">оплачено</span>`}
function renderSummary(){
  if(openRec)return renderRecipient(openRec);
  const months=[...new Set(S.shipments.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  if(period!=='all'&&!months.includes(period))period='all';
  const inP=s=>period==='all'||(s.date||'').startsWith(period),ps=S.shipments.filter(inP);
  const names=[...new Set([...recNames(),...S.shipments.map(s=>s.recipient),...S.payments.map(p=>p.recipient)])].filter(Boolean);
  const rows=names.map(n=>{const st=recStats(n),p=ps.filter(s=>s.recipient===n);return{n,st,pq:p.reduce((a,s)=>a+count(s.items),0),ps:p.reduce((a,s)=>a+sum(s.items),0)}}).sort((a,b)=>b.ps-a.ps);
  const models={};ps.forEach(s=>(s.items||[]).forEach(x=>{const k=label(x);models[k]=models[k]||{q:0,s:0};models[k].q+=+x.qty||0;models[k].s+=(+x.qty||0)*(+x.price||0)}));
  const ml=Object.entries(models).sort((a,b)=>b[1].q-a[1].q);
  
  $('view').innerHTML=`
  <section class="card">
    <label class="fld"><span>Период</span><select id="f-period" onchange="period=this.value;renderSummary()"><option value="all">Всё время</option>${months.map(m=>`<option value="${m}" ${m===period?'selected':''}>${monthName(m)}</option>`).join('')}</select></label>
    <div class="stats"><div class="stat"><b>${num(ps.reduce((a,s)=>a+count(s.items),0))}</b><span>шт. отгружено</span></div><div class="stat"><b>${money(ps.reduce((a,s)=>a+sum(s.items),0))}</b><span>на сумму</span></div><div class="stat"><b>${ps.length}</b><span>накладных</span></div></div>
  </section>
  <section class="card"><h2>Получатели</h2><div class="list">${rows.length?rows.map(r=>`<button class="rcard" data-r="${esc(r.n)}" onclick="openRec=this.dataset.r;renderSummary();window.scrollTo(0,0)"><span class="l"><b>${esc(r.n)}</b><span class="meta">${period==='all'?'за всё время':'за месяц'}: ${num(r.pq)} шт. · ${money(r.ps)}</span></span><span class="r"><span class="meta">›</span></span></button>`).join(''):'<p class="empty">Получателей пока нет</p>'}</div><p class="meta" style="margin:0">Нажми на получателя, чтобы увидеть его накладные и модели.</p></section>
  <section class="card"><h2>По моделям</h2>${ml.length?`<div class="tbl"><table><thead><tr><th>Модель</th><th>Шт.</th><th>Сумма, ₽</th></tr></thead><tbody>${ml.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v.q)}</td><td>${num(v.s)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">За этот период отгрузок нет</p>'}</section>`;
}
function renderRecipient(name){

  $('view').innerHTML=`

  </section>
  <section class="card"><h2>Накладные</h2>${sh.length?`<div>${sh.map(s=>`<div class="lrow"><div><b>№ ${esc(s.number)}</b> <span class="meta">· ${fmtD(s.date)} · ${num(count(s.items))} шт.</span></div><span class="sub">${money(sum(s.items))}</span></div>`).join('')}</div>`:'<p class="empty">Накладных пока нет</p>'}</section>
  <section class="card"><h2>По моделям</h2>${ml.length?`<div class="tbl"><table><thead><tr><th>Модель</th><th>Шт.</th></tr></thead><tbody>${ml.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Отгрузок пока нет</p>'}</section>`;
}
function addPayment(name){const a=+$('f-pa').value,d=$('f-pd').value||today(),n=$('f-pn').value.trim();if(!(a>0))return toast('Укажи сумму оплаты','err');put('payments',{id:uid('pay'),recipient:name,amount:a,date:d,note:n,createdAt:nowIso()});toast('Оплата записана');renderSummary()}
async function deletePayment(id){const p=S.payments.find(x=>x.id===id);if(!p||!await ask(`Удалить оплату ${money(p.amount)} от ${fmtD(p.date)}?`,'Удалить',{danger:1}))return;remove('payments',id);toast('Оплата удалена');renderSummary()}

/* ---------- catalog ---------- */
function renderCatalog(){
  $('view').innerHTML=`
  <section class="card"><h2>Новая модель</h2><label class="fld"><span>Название</span><input id="f-pn" placeholder="Например, Бини"></label><div class="grid2"><label class="fld"><span>Вариант</span><input id="f-pv" placeholder="с отворотом, флис…"></label><label class="fld"><span>Цена за шт., ₽</span><input id="f-pp" type="number" inputmode="decimal" min="0" step="any" placeholder="260"></label></div><div class="actions"><button class="primary" onclick="createProduct()">Добавить в каталог</button></div></section>
  <section class="card"><div class="row"><h2>Каталог</h2><span class="muted">${S.products.length} поз.</span></div><input id="f-cq" type="search" placeholder="Найти модель…" value="${esc(cq)}" oninput="cq=this.value;drawCList()"><div id="clist"></div></section>`;
  drawCList();
}
function drawCList(){
  const t=cq.trim().toLowerCase(),shipped={};S.shipments.forEach(s=>(s.items||[]).forEach(x=>{if(x.productId)shipped[x.productId]=(shipped[x.productId]||0)+(+x.qty||0)}));
  const ps=S.products.slice().sort(byName).filter(p=>!t||(p.name+' '+p.variant).toLowerCase().includes(t));
  $('clist').innerHTML=ps.length?ps.map(p=>editProd===p.id?`<div class="item"><label class="fld"><span>Название</span><input id="e-n" value="${esc(p.name)}"></label><div class="grid2"><label class="fld"><span>Вариант</span><input id="e-v" value="${esc(p.variant)}"></label><label class="fld"><span>Цена, ₽</span><input id="e-p" type="number" inputmode="decimal" min="0" step="any" value="${esc(p.price)}"></label></div><div class="actions"><button class="primary" onclick="saveProduct('${esc(p.id)}')">Сохранить</button><button onclick="editProd=null;drawCList()">Отмена</button><button class="danger" onclick="deleteProduct('${esc(p.id)}')">Удалить</button></div></div>`:`<div class="lrow"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.variant)} · ${money(p.price)}${shipped[p.id]?' · отгружено '+num(shipped[p.id])+' шт.':''}</div></div><button class="chip" onclick="editProd='${esc(p.id)}';drawCList()">Изменить</button></div>`).join(''):'<p class="empty">Ничего не нашлось</p>';
}
function createProduct(){const name=$('f-pn').value.trim(),variant=$('f-pv').value.trim()||'Стандарт',pr=$('f-pp').value,price=+pr;if(!name||pr===''||!(price>=0))return toast('Укажи название и цену','err');if(S.products.some(p=>p.name.toLowerCase()===name.toLowerCase()&&(p.variant||'').toLowerCase()===variant.toLowerCase()))return toast('Такая модель уже есть','err');put('products',{id:uid('p'),name,variant,price});toast('Модель добавлена');renderCatalog()}
function saveProduct(id){const p=S.products.find(x=>x.id===id),name=$('e-n').value.trim(),variant=$('e-v').value.trim()||'Стандарт',price=+$('e-p').value;if(!p||!name||!($('e-p').value!==''&&price>=0))return toast('Укажи название и цену','err');put('products',{...p,name,variant,price});editProd=null;toast('Сохранено. Старые накладные не меняются');drawCList()}
async function deleteProduct(id){const p=S.products.find(x=>x.id===id);if(!p||!await ask(`Удалить «${label(p)}» из каталога? Старые накладные сохранятся.`,'Удалить',{danger:1}))return;remove('products',id);editProd=null;toast('Модель удалена');renderCatalog()}

/* ---------- data & sync settings ---------- */
function renderData(){
  const time=meta.last?new Date(meta.last).toLocaleString('ru-RU'):'ещё не было';
  $('view').innerHTML=`
  <section class="card"><h2>Google Таблица</h2>
    ${cfg.url?`<p class="meta" style="margin:0">Подключена. Последняя синхронизация: ${time}.</p>`:'<p class="meta" style="margin:0">Подключи таблицу, и каждая накладная будет сохраняться в твой Google Диск. Новый телефон или компаньон подключаются по той же ссылке и ключу.</p>'}
    <label class="fld"><span>Ссылка веб-приложения</span><input id="f-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}"></label>
    <label class="fld"><span>Ключ</span><input id="f-key" placeholder="nit-…" value="${esc(cfg.key)}" autocomplete="off"></label>
    <div class="actions"><button class="primary" onclick="saveCfg()">${cfg.url?'Сохранить':'Подключить'}</button>${cfg.url?'<button onclick="sync(true)">Синхронизировать сейчас</button><button class="ghost" onclick="dropCfg()">Отключить</button>':''}</div>
    <details><summary>Как подключить таблицу</summary><ol class="steps">
      <li>Создай новую Google Таблицу, например «NITTIONE Накладные».</li>
      <li>В таблице открой «Расширения» → «Apps Script».</li>
      <li>Удали всё в редакторе и вставь код из файла Code.gs. Нажми «Сохранить».</li>
      <li>«Начать развёртывание» → «Новое развёртывание» → тип «Веб-приложение». «Запуск от имени»: я; «У кого есть доступ»: все. Нажми «Начать развёртывание» и разреши доступ.</li>
      <li>Скопируй ссылку, которая заканчивается на /exec, и вставь сюда. Ключ возьми из начала кода (строка const KEY).</li>
    </ol></details>
  </section>
  <section class="card"><h2>Получатели</h2><div>${S.recipients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(r=>`<div class="lrow"><span>${esc(r.name)}</span><button class="x" aria-label="Удалить получателя" onclick="deleteRecipient('${esc(r.id)}')">✕</button></div>`).join('')||'<p class="empty">Получателей пока нет</p>'}</div>
  <div class="row"><input id="f-nr" placeholder="Имя и город, например Оля Казань"><button class="primary" onclick="addRecipient()">Добавить</button></div></section>
  <section class="card"><h2>Файлы</h2>
  <div class="actions"><button onclick="exportJSON()">Резервная копия</button><button onclick="exportCSV()">Таблица для Excel</button><button onclick="$('f-imp').click()">Восстановить из файла</button></div>
  <input id="f-imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''"></section>`;
}
function saveCfg(){const url=$('f-url').value.trim(),key=$('f-key').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url))return toast('Нужна ссылка вида https://script.google.com/macros/s/…/exec','err');if(!key)return toast('Укажи ключ из кода (строка const KEY)','err');cfg={url,key};lsSet(LSC,JSON.stringify(cfg));syncErr='';firstPull=true;toast('Подключаю таблицу…');render();sync(true)}
async function dropCfg(){if(!await ask('Отключить таблицу на этом телефоне? Данные останутся и в таблице, и здесь.','Отключить'))return;cfg={url:'',key:''};lsSet(LSC,'{}');syncErr='';render()}
function addRecipient(){const v=$('f-nr').value.trim();if(!v)return;if(recNames().some(n=>n.toLowerCase()===v.toLowerCase()))return toast('Такой получатель уже есть','err');put('recipients',{id:uid('r'),name:v});toast('Получатель добавлен');renderData()}
async function deleteRecipient(id){const r=S.recipients.find(x=>x.id===id);if(!r||!await ask(`Убрать «${r.name}» из списка получателей? Накладные и оплаты останутся.`,'Убрать',{danger:1}))return;remove('recipients',id);renderData()}

/* ---------- files ---------- */
async function saveFile(name,data,type,share){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  if(share&&navigator.canShare){try{const f=new File([blob],name,{type:blob.type||type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);toast('Файл скачан: '+name);
}
function exportJSON(){const data={version:2,exportedAt:nowIso(),products:S.products,recipients:recNames(),shipments:S.shipments.slice().sort((a,b)=>a.number-b.number),payments:S.payments};saveFile('nakladnye-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')}
function exportCSV(){const q=v=>{const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},c=n=>String(n).replace('.',',');const rows=[['Номер','Дата','Получатель','Модель','Вариант','Кол-во','Цена','Сумма']];S.shipments.slice().sort((a,b)=>a.number-b.number).forEach(s=>(s.items||[]).forEach(x=>rows.push([s.number,fmtD(s.date),s.recipient,x.name,x.variant,c(x.qty),c(x.price),c(x.qty*x.price)])));saveFile('nakladnye-'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv')}
async function importData(file){
  if(!file)return;let o;try{o=JSON.parse(await file.text())}catch(e){return toast('Файл не читается. Нужен .json из «Резервной копии»','err')}
  if(!Array.isArray(o.products)||!Array.isArray(o.shipments))return toast('Это не резервная копия накладных','err');
  const pays=Array.isArray(o.payments)?o.payments:[],recs=(o.recipients||[]).map(r=>typeof r==='string'?r:r?.name).filter(Boolean);
  o.shipments.forEach(s=>s.recipient&&recs.push(s.recipient));
  if(!await ask(`Загрузить из файла ${o.shipments.length} накладных, ${o.products.length} моделей и ${pays.length} оплат?\nЗаписи из файла заменят такие же записи здесь, остальное останется.`,'Загрузить'))return;
  o.products.forEach(p=>put('products',{id:String(p.id||uid('p')),name:String(p.name||''),variant:String(p.variant||'Стандарт'),price:+p.price||0},true));
  o.shipments.forEach(s=>put('shipments',{id:String(s.id||uid('s')),number:+s.number||0,date:String(s.date||''),recipient:String(s.recipient||''),items:(s.items||[]).map(x=>({productId:String(x.productId||''),name:String(x.name||''),variant:String(x.variant||'Стандарт'),qty:+x.qty||0,price:+x.price||0})),createdAt:s.createdAt||nowIso()},true));
  pays.forEach(p=>put('payments',{id:String(p.id||uid('pay')),recipient:String(p.recipient||''),amount:+p.amount||0,date:String(p.date||''),note:String(p.note||''),createdAt:p.createdAt||nowIso()},true));
  rebuild();const have=new Set(recNames().map(x=>x.toLowerCase()));[...new Set(recs)].forEach(r=>{if(!have.has(r.toLowerCase())){put('recipients',{id:uid('r'),name:r},true);have.add(r.toLowerCase())}});
  commit();toast('Готово: загружено '+o.shipments.length+' накладных');render();
}

/* ---------- invoice image / pdf / text ---------- */
function invoiceCanvas(s){
  const W=900,pad=48,c=document.createElement('canvas'),ctx=c.getContext('2d'),F='Montserrat,Arial,sans-serif';
  ctx.font='27px '+F;
  const wrap=(str,max)=>{const out=[];let line='';for(const w of String(str).split(/\s+/)){const t=line?line+' '+w:w;if(ctx.measureText(t).width>max&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out.length?out:['']};
  const rows=s.items.map(x=>{const lines=wrap(x.name+(x.variant&&x.variant!=='Стандарт'?' ('+x.variant+')':''),440);return{x,lines,h:Math.max(80,lines.length*33+28)}});
  const H=285+rows.reduce((a,r)=>a+r.h,0)+320;c.width=W;c.height=H;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0b0b0b';ctx.font='500 32px '+F;try{ctx.letterSpacing='16px'}catch(e){}ctx.textAlign='center';ctx.fillText('NITTIONE',W/2+8,58);try{ctx.letterSpacing='0px'}catch(e){}ctx.textAlign='left';ctx.fillRect(pad,86,W-2*pad,2);ctx.translate(0,70);
  ctx.font='bold 44px '+F;ctx.fillText('НАКЛАДНАЯ № '+s.number,pad,80);
  ctx.font='28px '+F;ctx.fillText('Дата: '+fmtD(s.date),pad,134);ctx.fillText('Получатель: '+s.recipient,pad,176);
  let y=224;ctx.fillStyle='#f0f0ef';ctx.fillRect(pad,y,W-2*pad,50);ctx.fillStyle='#0b0b0b';ctx.font='bold 24px '+F;ctx.fillText('Наименование',pad+12,y+33);ctx.textAlign='right';ctx.fillText('Кол-во',640,y+33);ctx.fillText('Сумма, ₽',W-pad-12,y+33);ctx.textAlign='left';y+=50;
  for(const r of rows){ctx.strokeStyle='#dddddb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y+r.h);ctx.lineTo(W-pad,y+r.h);ctx.stroke();ctx.fillStyle='#0b0b0b';ctx.font='27px '+F;r.lines.forEach((l,i)=>ctx.fillText(l,pad+12,y+36+i*33));ctx.font='22px '+F;ctx.fillStyle='#6f6f6f';ctx.fillText(num(r.x.price)+' ₽/шт.',pad+12,y+r.h-14);ctx.fillStyle='#0b0b0b';ctx.font='26px '+F;ctx.textAlign='right';ctx.fillText(num(r.x.qty),640,y+38);ctx.fillText(num(r.x.qty*r.x.price),W-pad-12,y+38);ctx.textAlign='left';y+=r.h}
  y+=50;ctx.font='bold 30px '+F;ctx.fillText('Всего: '+num(count(s.items))+' шт.',pad,y);y+=50;ctx.fillText('Итого: '+money(sum(s.items)),pad,y);
  y+=80;ctx.font='24px '+F;ctx.fillStyle='#6f6f6f';ctx.fillText('Передал: ______________',pad,y);ctx.fillText('Получил: ______________',W/2+10,y);
  return c;
}
const fname=(s,ext)=>'Накладная-'+String(s.number).replace(/[^\wА-Яа-яЁё-]/g,'')+(s.recipient?' '+s.recipient.replace(/[^\wА-Яа-яЁё -]/g,''):'')+'.'+ext;
async function exportPNG(s){if(!s)return;try{await document.fonts?.ready}catch(e){}invoiceCanvas(s).toBlob(b=>{if(!b)return toast('Не удалось создать фото','err');saveFile(fname(s,'png'),b,'image/png',true)},'image/png')}
async function exportPDF(s){if(!s)return;if(!window.jspdf)return toast('PDF загрузится, когда появится интернет. Пока отправь фото','err');try{await document.fonts?.ready}catch(e){}const c=invoiceCanvas(s),w=c.width*.6,h=c.height*.6;const pdf=new window.jspdf.jsPDF({orientation:w>h?'l':'p',unit:'pt',format:[w,h]});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);saveFile(fname(s,'pdf'),pdf.output('blob'),'application/pdf',true)}
function invoiceText(s){return[`Накладная № ${s.number} от ${fmtD(s.date)}`,`Получатель: ${s.recipient}`,'',...s.items.map((x,i)=>`${i+1}. ${label(x)} — ${num(x.qty)} шт × ${num(x.price)} = ${money(x.qty*x.price)}`),'',`Всего: ${num(count(s.items))} шт.`,`Итого: ${money(sum(s.items))}`].join('\n')}
function copyText(s){if(!s)return;const t=invoiceText(s);const fb=()=>ask('Скопируй текст накладной:','',{text:t,noOk:1});try{navigator.clipboard.writeText(t).then(()=>toast('Текст скопирован, вставь в WhatsApp или Telegram'),fb)}catch(e){fb()}}

/* ---------- start ---------- */
rebuild();
if(cfg.url&&!store.shipments.length)firstPull=true;
render();
if(cfg.url)sync();
try{navigator.storage?.persist?.()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
